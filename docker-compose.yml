version: '3.8'

services:
  # Official Hindsight Memory Server
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: batchwise_hindsight
    ports:
      - "8888:8888" # API Port
      - "9999:9999" # UI Port
    environment:
      - HINDSIGHT_API_LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  # PostgreSQL Database for structured application data
  db:
    image: postgres:15-alpine
    container_name: batchwise_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: batchwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hindsight-data:
  pgdata:
